name: Docker Build & Publish

# 改动说明（相对上游）：
#  1. 加了 workflow_dispatch：可以在 Actions 页面手动点「Run workflow」构建
#  2. 默认只构建 linux/amd64（你的 NAS 是 x86_64），十几分钟出镜像；要全架构选 multi
#  3. 只推 ghcr.io（去掉 Docker Hub：那是上游 ednovas 的仓库，你推不上去，登录也会失败）

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建架构'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - multi
  push:
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dongguatv

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查 db.json（存在就会打进镜像）
        run: |
          if [ -f db.json ]; then
            python3 -c "import json;d=json.load(open('db.json'));print('已内置 db.json，源数量:', len(d.get('sites') or []))"
          else
            echo "仓库里没有 db.json，镜像将使用 db.template.json 占位（运行时靠 REMOTE_DB_URL 提供源）"
          fi

      - name: Set up QEMU
        if: github.event.inputs.platforms == 'multi'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ github.event.inputs.platforms == 'multi' && 'linux/amd64,linux/arm64,linux/arm/v7' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
