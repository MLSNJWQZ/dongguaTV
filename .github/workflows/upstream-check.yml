name: 上游更新提醒

# 每天检查上游 EdNovas/dongguaTV 有没有新提交。
# 有更新 → 开/更新 Issue 提醒（已存在则原地更新内容，不会重复刷屏）
# 没更新 → 自动关掉这个 Issue
# 注意：只提醒，不自动 merge（本 fork 定制较多，自动合并容易冲突）
#
# 重要：本文件全部使用 curl + REST API，**不要**改用 gh CLI。
# 原因：gh issue list/create/edit/close 走 GraphQL，GITHUB_TOKEN 在 fork 仓库上
# 会返回 "Resource not accessible by integration"，且 gh issue list --json 会
# 静默返回空数组，导致去重与自动关闭双双失效（历史上 Issue 就是这么堆到 9 个的）。

on:
  schedule:
    # 北京 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 比对上游 main
        run: |
          set -e
          git remote add upstream https://github.com/EdNovas/dongguaTV.git 2>/dev/null || true
          git fetch --depth=80 upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..HEAD)
          echo "落后上游 $BEHIND 个提交，领先 $AHEAD 个提交"
          echo "BEHIND=$BEHIND" >> "$GITHUB_ENV"
          echo "AHEAD=$AHEAD" >> "$GITHUB_ENV"
          git log --pretty=format:'- %h %s' HEAD..upstream/main | head -15 > upstream_commits.txt || true

      # 用 REST 列出全部 open issue，再本地 jq 过滤标题（不用 gh、不用搜索 API）
      - name: 查找已有提醒 Issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          NUM=$(curl -sS -H "Authorization: token $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$REPO/issues?state=open&per_page=100" \
               | jq -r '[.[] | select(.pull_request == null) | select(.title | contains("上游 dongguaTV"))] | .[0].number // empty')
          echo "找到已有提醒 Issue: ${NUM:-无}"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"

      - name: 有更新 → 开/更新 Issue
        if: env.BEHIND != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="⬆️ 上游 dongguaTV 有 $BEHIND 个新提交待合并"
          {
            echo "上游 [EdNovas/dongguaTV](https://github.com/EdNovas/dongguaTV) 有 **$BEHIND** 个新提交没合并（你的分支领先上游 $AHEAD 个提交）。"
            echo ""
            echo "### 处理步骤（你现在跑的是作者镜像，只需第 1 步）"
            echo "1. NAS 上拉新镜像：\`cd /vol1/1000/docker/ETV && docker compose pull && docker compose up -d\`"
            echo "2. 如果作者还没发布新镜像（刚提交、还没构建），等几小时再 pull"
            echo ""
            echo "> 仅当你以后切换到自建镜像 \`ghcr.io/mlsnjwqz/dongguatv\` 时，才需要：Sync fork → Update branch → Actions 手动 Run「Docker Build & Publish」→ NAS pull。"
            echo ""
            echo "### 上游新提交"
            cat upstream_commits.txt
            echo ""
            echo "_本 Issue 由每天 09:00 的「上游更新提醒」自动维护，合并完会自动关闭。_"
          } > issue_body.md

          NUM="${{ steps.find.outputs.num }}"
          PAYLOAD=$(jq -n --arg t "$TITLE" --rawfile b issue_body.md '{title:$t, body:$b}')

          if [ -n "$NUM" ]; then
            echo "更新已有提醒 Issue #$NUM"
            HTTP=$(curl -sS -o resp.json -w "%{http_code}" -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$NUM" \
              -d "$PAYLOAD")
            echo "edit issue http=$HTTP"
            cat resp.json
            [ "$HTTP" = "200" ]
          else
            echo "没有已有提醒，新建一个"
            HTTP=$(curl -sS -o resp.json -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues" \
              -d "$PAYLOAD")
            echo "create issue http=$HTTP"
            cat resp.json
            [ "$HTTP" = "201" ]
          fi

      - name: 无更新 → 关掉已有提醒
        if: env.BEHIND == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          NUM="${{ steps.find.outputs.num }}"
          if [ -n "$NUM" ]; then
            echo "已与上游一致，关闭 Issue #$NUM"
            HTTP=$(curl -sS -o resp.json -w "%{http_code}" -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$NUM" \
              -d '{"state":"closed","state_reason":"completed","body":"上游的提交已全部合并，本提醒自动关闭。"}')
            echo "close issue http=$HTTP"
            cat resp.json
          else
            echo "已与上游一致，无需提醒"
          fi
